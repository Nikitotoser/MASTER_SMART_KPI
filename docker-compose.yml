version: '3.8'

services:
  influxdb:
    image: influxdb:2.7
    container_name: smart_energy_db
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_ORG=KPI
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=secretpassword_smartenergy6
      - DOCKER_INFLUXDB_INIT_BUCKET=smart_energy
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=secretpassword_smartenergy6
    volumes:
      - influxdb-data:/var/lib/influxdb2
    restart: unless-stopped

  backend:
    build: ./python_backend
    container_name: smart_energy_api
    ports:
      - "6006:8000"
    environment:
      - TZ=Europe/Berlin
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=secretpassword_smartenergy6
      - INFLUX_ORG=KPI
      - INFLUX_BUCKET=smart_energy
      - MQTT_BROKER=broker.hivemq.com
      - MQTT_PORT=1883
    depends_on:
      - influxdb
    restart: unless-stopped

  ml_backend:
    build: ./smart_energy_edge
    container_name: smart_energy_ml_api
    ports:
      - "8000:8000"
    environment:
      - TZ=Europe/Berlin
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=secretpassword_smartenergy6
      - INFLUX_ORG=KPI
      - INFLUX_BUCKET=smart_energy
      - MQTT_BROKER=broker.hivemq.com
      - MQTT_PORT=1883
      # Задаємо координати Берліна, щоб прогноз погоди збігався з фізичною локацією
      - LAT=52.52
      - LON=13.40
      - TEST_MODE=True
    volumes:
      # Життєво важливо для збереження моделей (MLOps) та логів при перезапусках контейнера
      - ./smart_energy_edge/data:/app/data
      - ./smart_energy_edge/models:/app/models
      - ./smart_energy_edge/logs:/app/logs
    depends_on:
      - influxdb
    restart: unless-stopped

  frontend:
    build: ./react-frontend
    container_name: smart_energy_ui
    ports:
      - "5173:5173"
    volumes:
      - ./react-frontend:/app
      - /app/node_modules 
    environment:
      - TZ=Europe/Berlin
      - CHOKIDAR_USEPOLLING=true
      # Прокидаємо адреси бекендів у React, інакше він не знайде API
      - VITE_TELEMETRY_API=http://localhost:6006/api/v1
      - VITE_ML_API=http://localhost:8000/api
    depends_on:
      - backend
      - ml_backend
    restart: unless-stopped

volumes:
  influxdb-data: