[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

build_flags = 
    -I src/core
    -I src/sensors
    -I src/network
    -I src/storage

# Розумний пошук бібліотек у вкладених папках
lib_ldf_mode = deep

lib_deps = 
    bblanchon/ArduinoJson@^7.0.3
    knolleary/PubSubClient@^2.8
    4-20ma/ModbusMaster@^2.0.1
    robtillaart/INA226@^0.6.0

test_build_src = yes